<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devices - INSIA Work Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-desktop"></i> IWM</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li>
                    <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
                </li>
                <li class="active">
                    <a href="devices.html"><i class="fas fa-laptop"></i> Devices</a>
                </li>
                <li>
                    <a href="activities.html"><i class="fas fa-chart-line"></i> Activities</a>
                </li>
                <li>
                    <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                </li>
                <li>
                    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="ms-3 navbar-text">
                        Welcome, <span id="userName"></span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid mt-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Device Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#deviceModal" onclick="openDeviceModal()">
                        <i class="fas fa-plus"></i> Register Device
                    </button>
                </div>

                <div id="alert-container"></div>

                <div class="card">
                    <div class="card-body">
                        <table id="deviceTable" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Device Name</th>
                                    <th>Employee</th>
                                    <th>OS Version</th>
                                    <th>Last Seen</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Device Modal -->
    <div class="modal fade" id="deviceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Register Device</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="deviceForm">
                        <input type="hidden" id="deviceId">
                        <div class="mb-3">
                            <label for="employee_id" class="form-label">Employee *</label>
                            <select class="form-select" id="employee_id" required>
                                <option value="">Select Employee</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="device_name" class="form-label">Device Name *</label>
                            <input type="text" class="form-control" id="device_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="os_version" class="form-label">OS Version</label>
                            <input type="text" class="form-control" id="os_version" placeholder="e.g., Windows 10 Pro">
                        </div>
                        <div class="mb-3">
                            <label for="agent_version" class="form-label">Agent Version</label>
                            <input type="text" class="form-control" id="agent_version" placeholder="e.g., 1.0.0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveDevice()">Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div class="modal fade" id="apiKeyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">API Key Generated</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>Important:</strong> This API key will only be shown once. Please save it securely.
                    </div>
                    <div class="mb-3">
                        <label class="form-label">API Key:</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="apiKeyValue" readonly>
                            <button class="btn btn-outline-secondary" onclick="copyApiKey()">
                                <i class="fas fa-copy"></i> Copy
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        checkAuth();
        
        let table;
        let employees = [];
        
        $(document).ready(function() {
            loadEmployees();
            loadDevices();
        });
        
        async function loadEmployees() {
            try {
                employees = await apiRequest('/api/admin/employees');
                const select = document.getElementById('employee_id');
                select.innerHTML = '<option value="">Select Employee</option>';
                employees.forEach(emp => {
                    select.innerHTML += `<option value="${emp.id}">${emp.name} - ${emp.position || 'No Position'}</option>`;
                });
            } catch (error) {
                console.error('Error loading employees:', error);
            }
        }
        
        async function loadDevices() {
            try {
                const devices = await apiRequest('/api/admin/devices');
                
                if (table) {
                    table.destroy();
                }
                
                const tbody = document.querySelector('#deviceTable tbody');
                tbody.innerHTML = '';
                
                devices.forEach(device => {
                    const statusClass = device.status === 'online' ? 'bg-success' : 'bg-secondary';
                    const row = `
                        <tr>
                            <td>${device.id}</td>
                            <td>${device.device_name}</td>
                            <td>${device.employee_name || '-'}</td>
                            <td>${device.os_version || '-'}</td>
                            <td>${formatDate(device.last_seen_at)}</td>
                            <td><span class="badge ${statusClass}">${device.status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-info" onclick="resetApiKey(${device.id})" title="Reset API Key">
                                    <i class="fas fa-key"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteDevice(${device.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                
                table = $('#deviceTable').DataTable();
            } catch (error) {
                showAlert('Error loading devices: ' + error.message, 'danger');
            }
        }
        
        function openDeviceModal() {
            document.getElementById('modalTitle').textContent = 'Register Device';
            document.getElementById('deviceForm').reset();
            document.getElementById('deviceId').value = '';
        }
        
        async function saveDevice() {
            const data = {
                employee_id: document.getElementById('employee_id').value,
                device_name: document.getElementById('device_name').value,
                os_version: document.getElementById('os_version').value,
                agent_version: document.getElementById('agent_version').value
            };
            
            if (!data.employee_id || !data.device_name) {
                showAlert('Employee and Device Name are required', 'danger');
                return;
            }
            
            try {
                const result = await apiRequest('/api/admin/devices', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                showAlert('Device registered successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('deviceModal')).hide();
                
                // Show API key
                document.getElementById('apiKeyValue').value = result.api_key;
                new bootstrap.Modal(document.getElementById('apiKeyModal')).show();
                
                loadDevices();
            } catch (error) {
                showAlert('Error registering device: ' + error.message, 'danger');
            }
        }
        
        async function resetApiKey(id) {
            if (!confirm('Are you sure you want to reset the API key for this device?')) return;
            
            try {
                const result = await apiRequest(`/api/admin/devices/${id}/reset-api-key`, {
                    method: 'POST'
                });
                
                showAlert('API key reset successfully', 'success');
                
                // Show new API key
                document.getElementById('apiKeyValue').value = result.api_key;
                new bootstrap.Modal(document.getElementById('apiKeyModal')).show();
            } catch (error) {
                showAlert('Error resetting API key: ' + error.message, 'danger');
            }
        }
        
        async function deleteDevice(id) {
            if (!confirm('Are you sure you want to delete this device?')) return;
            
            try {
                await apiRequest(`/api/admin/devices/${id}`, {
                    method: 'DELETE'
                });
                showAlert('Device deleted successfully', 'success');
                loadDevices();
            } catch (error) {
                showAlert('Error deleting device: ' + error.message, 'danger');
            }
        }
        
        function copyApiKey() {
            const input = document.getElementById('apiKeyValue');
            input.select();
            document.execCommand('copy');
            showAlert('API key copied to clipboard', 'success');
        }
    </script>
</body>
</html>
