<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - INSIA Work Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-desktop"></i> IWM</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li>
                    <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
                </li>
                <li>
                    <a href="devices.html"><i class="fas fa-laptop"></i> Devices</a>
                </li>
                <li>
                    <a href="activities.html"><i class="fas fa-chart-line"></i> Activities</a>
                </li>
                <li class="active">
                    <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                </li>
                <li>
                    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="ms-3 navbar-text">
                        Welcome, <span id="userName"></span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid mt-4">
                <h2 class="mb-4">Reports & Analytics</h2>

                <div class="row">
                    <!-- Daily Report -->
                    <div class="col-md-12 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-calendar-day"></i> Daily Report</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label class="form-label">Date</label>
                                        <input type="date" class="form-control" id="dailyDate" value="">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">Employee (Optional)</label>
                                        <select class="form-select" id="dailyEmployee">
                                            <option value="">All Employees</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">&nbsp;</label>
                                        <button class="btn btn-primary w-100" onclick="loadDailyReport()">
                                            <i class="fas fa-search"></i> Generate
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="dailyReport" class="mt-4"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Employee Report -->
                    <div class="col-md-12 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-user-clock"></i> Employee Report</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label class="form-label">Employee *</label>
                                        <select class="form-select" id="employeeReportId">
                                            <option value="">Select Employee</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">From Date</label>
                                        <input type="date" class="form-control" id="employeeFrom" value="">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">To Date</label>
                                        <input type="date" class="form-control" id="employeeTo" value="">
                                    </div>
                                    <div class="col-md-2">
                                        <label class="form-label">&nbsp;</label>
                                        <button class="btn btn-primary w-100" onclick="loadEmployeeReport()">
                                            <i class="fas fa-search"></i> Generate
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="employeeReport" class="mt-4"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Top Apps & Domains -->
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-trophy"></i> Top Applications</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">From Date</label>
                                        <input type="date" class="form-control" id="topAppsFrom" value="">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">To Date</label>
                                        <input type="date" class="form-control" id="topAppsTo" value="">
                                    </div>
                                </div>
                                <button class="btn btn-primary btn-sm mb-3" onclick="loadTopApps()">
                                    <i class="fas fa-sync"></i> Load
                                </button>
                                <div id="topAppsReport"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-globe"></i> Top Domains</h5>
                            </div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label">From Date</label>
                                        <input type="date" class="form-control" id="topDomainsFrom" value="">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">To Date</label>
                                        <input type="date" class="form-control" id="topDomainsTo" value="">
                                    </div>
                                </div>
                                <button class="btn btn-primary btn-sm mb-3" onclick="loadTopDomains()">
                                    <i class="fas fa-sync"></i> Load
                                </button>
                                <div id="topDomainsReport"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        checkAuth();
        
        // Initialize dates
        const today = new Date().toISOString().split('T')[0];
        const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
        
        document.getElementById('dailyDate').value = today;
        document.getElementById('employeeFrom').value = weekAgo;
        document.getElementById('employeeTo').value = today;
        document.getElementById('topAppsFrom').value = weekAgo;
        document.getElementById('topAppsTo').value = today;
        document.getElementById('topDomainsFrom').value = weekAgo;
        document.getElementById('topDomainsTo').value = today;
        
        // Load employees
        loadEmployees();
        
        async function loadEmployees() {
            try {
                const employees = await apiRequest('/api/admin/employees');
                
                const selects = [
                    document.getElementById('dailyEmployee'),
                    document.getElementById('employeeReportId')
                ];
                
                selects.forEach(select => {
                    employees.forEach(emp => {
                        select.innerHTML += `<option value="${emp.id}">${emp.name}</option>`;
                    });
                });
            } catch (error) {
                console.error('Error loading employees:', error);
            }
        }
        
        async function loadDailyReport() {
            const date = document.getElementById('dailyDate').value;
            const employeeId = document.getElementById('dailyEmployee').value;
            
            if (!date) {
                showAlert('Please select a date', 'warning');
                return;
            }
            
            try {
                let url = `/api/admin/reports/daily?date=${date}`;
                if (employeeId) url += `&employee_id=${employeeId}`;
                
                const report = await apiRequest(url);
                
                let html = '<div class="row">';
                
                // Summary cards
                html += `
                    <div class="col-md-3 mb-3">
                        <div class="card bg-primary text-white">
                            <div class="card-body">
                                <h6>Active Time</h6>
                                <h3>${formatDuration(report.active_time.total_seconds || 0)}</h3>
                                <small>${report.active_time.total_sessions || 0} sessions</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body">
                                <h6>Idle Time</h6>
                                <h3>${formatDuration(report.idle_time.total_seconds || 0)}</h3>
                                <small>${report.idle_time.total_sessions || 0} sessions</small>
                            </div>
                        </div>
                    </div>
                `;
                
                html += '</div>';
                
                // Top apps and domains
                html += '<div class="row"><div class="col-md-6">';
                html += '<h6>Top Applications</h6><div class="list-group">';
                if (report.top_apps.length === 0) {
                    html += '<div class="list-group-item text-muted">No data</div>';
                } else {
                    report.top_apps.forEach((app, i) => {
                        html += `
                            <div class="list-group-item d-flex justify-content-between">
                                <span>${i + 1}. ${app.app_name}</span>
                                <span class="badge bg-primary">${formatDuration(app.total_seconds)}</span>
                            </div>
                        `;
                    });
                }
                html += '</div></div>';
                
                html += '<div class="col-md-6">';
                html += '<h6>Top Domains</h6><div class="list-group">';
                if (report.top_domains.length === 0) {
                    html += '<div class="list-group-item text-muted">No data</div>';
                } else {
                    report.top_domains.forEach((domain, i) => {
                        html += `
                            <div class="list-group-item d-flex justify-content-between">
                                <span>${i + 1}. ${domain.domain}</span>
                                <span class="badge bg-info">${formatDuration(domain.total_seconds)}</span>
                            </div>
                        `;
                    });
                }
                html += '</div></div></div>';
                
                document.getElementById('dailyReport').innerHTML = html;
            } catch (error) {
                showAlert('Error loading daily report: ' + error.message, 'danger');
            }
        }
        
        async function loadEmployeeReport() {
            const employeeId = document.getElementById('employeeReportId').value;
            const from = document.getElementById('employeeFrom').value;
            const to = document.getElementById('employeeTo').value;
            
            if (!employeeId) {
                showAlert('Please select an employee', 'warning');
                return;
            }
            
            try {
                const report = await apiRequest(`/api/admin/reports/employee/${employeeId}?from=${from}&to=${to}`);
                
                let html = `
                    <h5>${report.employee.name}</h5>
                    <p class="text-muted">${report.employee.position || 'No position'}</p>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h6>Total Active Time</h6>
                                    <h4>${formatDuration(report.summary.total_active_seconds || 0)}</h4>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h6>Days Worked</h6>
                                    <h4>${report.summary.days_worked || 0}</h4>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card">
                                <div class="card-body">
                                    <h6>Devices Used</h6>
                                    <h4>${report.summary.devices_used || 0}</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <h6>Daily Breakdown</h6>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Active Time</th>
                                    <th>Sessions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                if (report.daily_breakdown.length === 0) {
                    html += '<tr><td colspan="3" class="text-muted text-center">No data</td></tr>';
                } else {
                    report.daily_breakdown.forEach(day => {
                        html += `
                            <tr>
                                <td>${day.date}</td>
                                <td>${formatDuration(day.active_seconds)}</td>
                                <td>${day.session_count}</td>
                            </tr>
                        `;
                    });
                }
                
                html += '</tbody></table></div>';
                
                document.getElementById('employeeReport').innerHTML = html;
            } catch (error) {
                showAlert('Error loading employee report: ' + error.message, 'danger');
            }
        }
        
        async function loadTopApps() {
            const from = document.getElementById('topAppsFrom').value;
            const to = document.getElementById('topAppsTo').value;
            
            try {
                const apps = await apiRequest(`/api/admin/reports/top-apps?from=${from}&to=${to}&limit=10`);
                
                let html = '<div class="list-group">';
                if (apps.length === 0) {
                    html += '<div class="list-group-item text-muted">No data</div>';
                } else {
                    apps.forEach((app, i) => {
                        html += `
                            <div class="list-group-item">
                                <div class="d-flex justify-content-between mb-1">
                                    <strong>${i + 1}. ${app.app_name}</strong>
                                    <span class="badge bg-primary">${formatDuration(app.total_seconds)}</span>
                                </div>
                                <small class="text-muted">
                                    ${app.session_count} sessions | ${app.device_count} devices
                                </small>
                            </div>
                        `;
                    });
                }
                html += '</div>';
                
                document.getElementById('topAppsReport').innerHTML = html;
            } catch (error) {
                showAlert('Error loading top apps: ' + error.message, 'danger');
            }
        }
        
        async function loadTopDomains() {
            const from = document.getElementById('topDomainsFrom').value;
            const to = document.getElementById('topDomainsTo').value;
            
            try {
                const domains = await apiRequest(`/api/admin/reports/top-domains?from=${from}&to=${to}&limit=10`);
                
                let html = '<div class="list-group">';
                if (domains.length === 0) {
                    html += '<div class="list-group-item text-muted">No data</div>';
                } else {
                    domains.forEach((domain, i) => {
                        html += `
                            <div class="list-group-item">
                                <div class="d-flex justify-content-between mb-1">
                                    <strong>${i + 1}. ${domain.domain}</strong>
                                    <span class="badge bg-info">${formatDuration(domain.total_seconds)}</span>
                                </div>
                                <small class="text-muted">
                                    ${domain.session_count} sessions | ${domain.device_count} devices
                                </small>
                            </div>
                        `;
                    });
                }
                html += '</div>';
                
                document.getElementById('topDomainsReport').innerHTML = html;
            } catch (error) {
                showAlert('Error loading top domains: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
