<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees - INSIA Work Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-desktop"></i> IWM</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="active">
                    <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
                </li>
                <li>
                    <a href="devices.html"><i class="fas fa-laptop"></i> Devices</a>
                </li>
                <li>
                    <a href="activities.html"><i class="fas fa-chart-line"></i> Activities</a>
                </li>
                <li>
                    <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                </li>
                <li>
                    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="ms-3 navbar-text">
                        Welcome, <span id="userName"></span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid mt-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Employee Management</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#employeeModal" onclick="openEmployeeModal()">
                        <i class="fas fa-plus"></i> Add Employee
                    </button>
                </div>

                <div id="alert-container"></div>

                <div class="card">
                    <div class="card-body">
                        <table id="employeeTable" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Position</th>
                                    <th>Work Hours</th>
                                    <th>Devices</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Employee Modal -->
    <div class="modal fade" id="employeeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Employee</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="employeeForm">
                        <input type="hidden" id="employeeId">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name *</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="position" class="form-label">Position</label>
                            <input type="text" class="form-control" id="position">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="work_start" class="form-label">Work Start</label>
                                <input type="time" class="form-control" id="work_start" value="09:00">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="work_end" class="form-label">Work End</label>
                                <input type="time" class="form-control" id="work_end" value="17:00">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="saveEmployee()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        checkAuth();
        
        let table;
        
        $(document).ready(function() {
            loadEmployees();
        });
        
        async function loadEmployees() {
            try {
                const employees = await apiRequest('/api/admin/employees');
                
                if (table) {
                    table.destroy();
                }
                
                const tbody = document.querySelector('#employeeTable tbody');
                tbody.innerHTML = '';
                
                employees.forEach(emp => {
                    const row = `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.name}</td>
                            <td>${emp.position || '-'}</td>
                            <td>${emp.work_start} - ${emp.work_end}</td>
                            <td>
                                <span class="badge bg-info">${emp.device_count || 0}</span>
                                <span class="badge bg-success">${emp.online_devices || 0} online</span>
                            </td>
                            <td>
                                <span class="badge ${emp.status === 'active' ? 'bg-success' : 'bg-secondary'}">
                                    ${emp.status}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning" onclick="editEmployee(${emp.id})">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${emp.id})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                
                table = $('#employeeTable').DataTable();
            } catch (error) {
                showAlert('Error loading employees: ' + error.message, 'danger');
            }
        }
        
        function openEmployeeModal() {
            document.getElementById('modalTitle').textContent = 'Add Employee';
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
        }
        
        async function editEmployee(id) {
            try {
                const employee = await apiRequest(`/api/admin/employees/${id}`);
                
                document.getElementById('modalTitle').textContent = 'Edit Employee';
                document.getElementById('employeeId').value = employee.id;
                document.getElementById('name').value = employee.name;
                document.getElementById('position').value = employee.position || '';
                document.getElementById('work_start').value = employee.work_start;
                document.getElementById('work_end').value = employee.work_end;
                document.getElementById('status').value = employee.status;
                
                new bootstrap.Modal(document.getElementById('employeeModal')).show();
            } catch (error) {
                showAlert('Error loading employee: ' + error.message, 'danger');
            }
        }
        
        async function saveEmployee() {
            const id = document.getElementById('employeeId').value;
            const data = {
                name: document.getElementById('name').value,
                position: document.getElementById('position').value,
                work_start: document.getElementById('work_start').value + ':00',
                work_end: document.getElementById('work_end').value + ':00',
                status: document.getElementById('status').value
            };
            
            try {
                if (id) {
                    await apiRequest(`/api/admin/employees/${id}`, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                    showAlert('Employee updated successfully', 'success');
                } else {
                    await apiRequest('/api/admin/employees', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    showAlert('Employee created successfully', 'success');
                }
                
                bootstrap.Modal.getInstance(document.getElementById('employeeModal')).hide();
                loadEmployees();
            } catch (error) {
                showAlert('Error saving employee: ' + error.message, 'danger');
            }
        }
        
        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) return;
            
            try {
                await apiRequest(`/api/admin/employees/${id}`, {
                    method: 'DELETE'
                });
                showAlert('Employee deleted successfully', 'success');
                loadEmployees();
            } catch (error) {
                showAlert('Error deleting employee: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
