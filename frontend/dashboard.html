<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - INSIA Work Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-desktop"></i> IWM</h3>
            </div>
            <ul class="list-unstyled components">
                <li class="active">
                    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li>
                    <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
                </li>
                <li>
                    <a href="devices.html"><i class="fas fa-laptop"></i> Devices</a>
                </li>
                <li>
                    <a href="activities.html"><i class="fas fa-chart-line"></i> Activities</a>
                </li>
                <li>
                    <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                </li>
                <li>
                    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="ms-3 navbar-text">
                        Welcome, <span id="userName"></span>
                    </span>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid mt-4">
                <h2 class="mb-4">Dashboard</h2>
                
                <!-- Statistics Cards -->
                <div class="row">
                    <div class="col-md-3 mb-4">
                        <div class="card stat-card bg-primary text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6>Devices Online</h6>
                                        <h2 id="devicesOnline">0</h2>
                                    </div>
                                    <div class="stat-icon">
                                        <i class="fas fa-laptop fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-4">
                        <div class="card stat-card bg-success text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6>Total Employees</h6>
                                        <h2 id="totalEmployees">0</h2>
                                    </div>
                                    <div class="stat-icon">
                                        <i class="fas fa-users fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-4">
                        <div class="card stat-card bg-warning text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6>Active Time Today</h6>
                                        <h2 id="todayActive">0h</h2>
                                    </div>
                                    <div class="stat-icon">
                                        <i class="fas fa-clock fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-3 mb-4">
                        <div class="card stat-card bg-danger text-white">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <h6>Idle Time Today</h6>
                                        <h2 id="todayIdle">0h</h2>
                                    </div>
                                    <div class="stat-icon">
                                        <i class="fas fa-pause fa-3x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5>Top Applications (Today)</h5>
                            </div>
                            <div class="card-body">
                                <div id="topApps" class="chart-placeholder">
                                    <p class="text-muted">Loading...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-header">
                                <h5>Top Domains (Today)</h5>
                            </div>
                            <div class="card-body">
                                <div id="topDomains" class="chart-placeholder">
                                    <p class="text-muted">Loading...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if logged in
        checkAuth();
        
        // Load dashboard data
        loadDashboard();
        
        async function loadDashboard() {
            try {
                const stats = await apiRequest('/api/admin/reports/dashboard');
                
                document.getElementById('devicesOnline').textContent = stats.devices_online || 0;
                document.getElementById('totalEmployees').textContent = stats.total_employees || 0;
                document.getElementById('todayActive').textContent = formatSeconds(stats.today_active_seconds || 0);
                document.getElementById('todayIdle').textContent = formatSeconds(stats.today_idle_seconds || 0);
                
                // Load today's top apps
                const date = new Date().toISOString().split('T')[0];
                const dailyReport = await apiRequest(`/api/admin/reports/daily?date=${date}`);
                
                displayTopApps(dailyReport.top_apps || []);
                displayTopDomains(dailyReport.top_domains || []);
                
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }
        
        function displayTopApps(apps) {
            const container = document.getElementById('topApps');
            if (apps.length === 0) {
                container.innerHTML = '<p class="text-muted">No data available</p>';
                return;
            }
            
            let html = '<div class="list-group">';
            apps.forEach((app, index) => {
                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${index + 1}. ${app.app_name || 'Unknown'}</span>
                        <span class="badge bg-primary">${formatSeconds(app.total_seconds)}</span>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function displayTopDomains(domains) {
            const container = document.getElementById('topDomains');
            if (domains.length === 0) {
                container.innerHTML = '<p class="text-muted">No data available</p>';
                return;
            }
            
            let html = '<div class="list-group">';
            domains.forEach((domain, index) => {
                html += `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>${index + 1}. ${domain.domain || 'Unknown'}</span>
                        <span class="badge bg-info">${formatSeconds(domain.total_seconds)}</span>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }
        
        function formatSeconds(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours}h ${minutes}m`;
        }
    </script>
</body>
</html>
