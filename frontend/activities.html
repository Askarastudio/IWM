<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - INSIA Work Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-desktop"></i> IWM</h3>
            </div>
            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li>
                    <a href="employees.html"><i class="fas fa-users"></i> Employees</a>
                </li>
                <li>
                    <a href="devices.html"><i class="fas fa-laptop"></i> Devices</a>
                </li>
                <li class="active">
                    <a href="activities.html"><i class="fas fa-chart-line"></i> Activities</a>
                </li>
                <li>
                    <a href="reports.html"><i class="fas fa-file-alt"></i> Reports</a>
                </li>
                <li>
                    <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="ms-3 navbar-text">
                        Welcome, <span id="userName"></span>
                    </span>
                </div>
            </nav>

            <div class="container-fluid mt-4">
                <h2 class="mb-4">Activity Monitoring</h2>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5><i class="fas fa-filter"></i> Filters</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Employee</label>
                                <select class="form-select" id="filterEmployee">
                                    <option value="">All Employees</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Device</label>
                                <select class="form-select" id="filterDevice">
                                    <option value="">All Devices</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" id="filterDate" value="">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Type</label>
                                <select class="form-select" id="filterType">
                                    <option value="">All</option>
                                    <option value="APP">Application</option>
                                    <option value="WEB">Web</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">&nbsp;</label>
                                <button class="btn btn-primary w-100" onclick="loadActivities()">
                                    <i class="fas fa-search"></i> Search
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="alert-container"></div>

                <div class="card">
                    <div class="card-body">
                        <table id="activityTable" class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Application/Domain</th>
                                    <th>Window Title</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Duration</th>
                                    <th>Work Hours</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        checkAuth();
        
        let table;
        
        $(document).ready(function() {
            // Set today's date
            document.getElementById('filterDate').value = new Date().toISOString().split('T')[0];
            
            loadEmployeesAndDevices();
            loadActivities();
        });
        
        async function loadEmployeesAndDevices() {
            try {
                const employees = await apiRequest('/api/admin/employees');
                const devices = await apiRequest('/api/admin/devices');
                
                const empSelect = document.getElementById('filterEmployee');
                employees.forEach(emp => {
                    empSelect.innerHTML += `<option value="${emp.id}">${emp.name}</option>`;
                });
                
                const devSelect = document.getElementById('filterDevice');
                devices.forEach(dev => {
                    devSelect.innerHTML += `<option value="${dev.id}">${dev.device_name} (${dev.employee_name})</option>`;
                });
            } catch (error) {
                console.error('Error loading filters:', error);
            }
        }
        
        async function loadActivities() {
            try {
                const employeeId = document.getElementById('filterEmployee').value;
                const deviceId = document.getElementById('filterDevice').value;
                const date = document.getElementById('filterDate').value;
                const type = document.getElementById('filterType').value;
                
                let url = '/api/admin/activities?';
                if (employeeId) url += `employee_id=${employeeId}&`;
                if (deviceId) url += `device_id=${deviceId}&`;
                if (date) url += `date=${date}&`;
                if (type) url += `type=${type}&`;
                
                const activities = await apiRequest(url);
                
                if (table) {
                    table.destroy();
                }
                
                const tbody = document.querySelector('#activityTable tbody');
                tbody.innerHTML = '';
                
                if (activities.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No activities found</td></tr>';
                } else {
                    activities.forEach(activity => {
                        const typeIcon = activity.type === 'APP' ? 'fa-window-maximize' : 'fa-globe';
                        const typeBadge = activity.type === 'APP' ? 'bg-primary' : 'bg-info';
                        const appDomain = activity.type === 'APP' ? activity.app_name : activity.domain;
                        
                        const row = `
                            <tr>
                                <td>
                                    <span class="badge ${typeBadge}">
                                        <i class="fas ${typeIcon}"></i> ${activity.type}
                                    </span>
                                </td>
                                <td>${appDomain || '-'}</td>
                                <td>${activity.window_title || '-'}</td>
                                <td>${formatDate(activity.start_time)}</td>
                                <td>${activity.end_time ? formatDate(activity.end_time) : 'Ongoing'}</td>
                                <td>${formatDuration(activity.duration_seconds)}</td>
                                <td>
                                    <span class="badge ${activity.is_work_hours ? 'bg-success' : 'bg-secondary'}">
                                        ${activity.is_work_hours ? 'Yes' : 'No'}
                                    </span>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                }
                
                table = $('#activityTable').DataTable({
                    order: [[3, 'desc']]
                });
            } catch (error) {
                showAlert('Error loading activities: ' + error.message, 'danger');
            }
        }
    </script>
</body>
</html>
